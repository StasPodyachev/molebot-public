    <label>Owner Address</label>

    /* ── State ──────────────────────────────────────────────────── */
    let provider, signer, account;

    /* ── Core ────────────────────────────────────────────────────── */
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += '\n' + msg;
      el.scrollTop = el.scrollHeight;
    }

    function status(on) {
      const b = document.getElementById('statusBadge');
      b.className = 'badge ' + (on ? 'on' : 'off');
      b.textContent = on ? '● Connected' : '○ Disconnected';
    }

    function checkForm() {
      const uri = document.getElementById('uriInput').value.trim();
      const agent = document.getElementById('agentInput').value.trim();
      const owner = document.getElementById('ownerInput').value.trim();
      const ok = uri && ethers.isAddress(agent) && ethers.isAddress(owner);
      document.getElementById('deployBtn').disabled = !ok;
    }

    async function connect() {
      if (!window.ethereum) { log('❌ Install MetaMask'); return; }
      try {
        const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
        account = acc[0];
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();

        document.getElementById('connectBtn').textContent = '✅ Connected';
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('addr').textContent = account;
        document.getElementById('deployForm').style.display = 'block';
        document.getElementById('agentInput').value = account;
        document.getElementById('ownerInput').value = account;
        status(true);
        log('✅ Connected: ' + account);

        const bal = await provider.getBalance(account);
        document.getElementById('bal').textContent = ethers.formatEther(bal) + ' ETH';

        const net = await provider.getNetwork();
        document.getElementById('net').textContent = net.name + ' (' + net.chainId + ')';

        window.ethereum.on('accountsChanged', (a) => {
          if (!a[0]) { disconnect(); return; }
          account = a[0];
          document.getElementById('addr').textContent = account;
          document.getElementById('agentInput').value = account;
          document.getElementById('ownerInput').value = account;
        });
        window.ethereum.on('chainChanged', () => window.location.reload());
      } catch (e) { log('❌ ' + e.message); }
    }

    function disconnect() {
      document.getElementById('connectBtn').textContent = '🔗 Connect MetaMask';
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('deployForm').style.display = 'none';
      document.getElementById('addr').textContent = '—';
      document.getElementById('bal').textContent = '—';
      document.getElementById('net').textContent = '—';
      status(false);
      account = null;
    }

    async function deploy() {
      const uri = document.getElementById('uriInput').value.trim();
      const agent = document.getElementById('agentInput').value.trim();
      const owner = document.getElementById('ownerInput').value.trim();
      const btn = document.getElementById('deployBtn');
      btn.disabled = true; btn.textContent = '⏳ Deploying...';
      log('⏳ Sending tx — confirm in MetaMask...');

      try {
        const factory = new ethers.ContractFactory(CONTRACT_ABI, CONTRACT_BYTECODE, signer);
        const contract = await factory.deploy(uri, agent, owner);
        log('⏳ Tx: ' + contract.deploymentTransaction().hash);
        await contract.waitForDeployment();
        const addr = await contract.getAddress();
        log('✅ Deployed: ' + addr);
        btn.textContent = '✅ Done';
      } catch (e) {
        log('❌ ' + e.message);
        btn.disabled = false;
        btn.textContent = '🚀 Deploy MolebotNFT';
      }
    }
  </script>
